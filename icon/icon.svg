<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>Smart IDP</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E3A8A"/>
      <stop offset="1" stop-color="#0D9488"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5EEAD4" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#5EEAD4" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#5EEAD4" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- tile -->
  <rect x="2" y="2" width="60" height="60" rx="13" fill="url(#tile)"/>

  <!-- document with folded corner -->
  <path d="M17 11h20l10 10v32a3 3 0 0 1-3 3H17a3 3 0 0 1-3-3V14a3 3 0 0 1 3-3z" fill="#FFFFFF"/>
  <path d="M37 11v7a3 3 0 0 0 3 3h7z" fill="#CBD5E1"/>

  <!-- extracted fields: label + value pairs -->
  <rect x="19" y="25" width="8" height="3" rx="1.5" fill="#94A3B8"/>
  <rect x="29" y="25" width="13" height="3" rx="1.5" fill="#1E3A8A"/>
  <rect x="19" y="32" width="8" height="3" rx="1.5" fill="#94A3B8"/>
  <rect x="29" y="32" width="10" height="3" rx="1.5" fill="#0D9488"/>
  <rect x="19" y="39" width="8" height="3" rx="1.5" fill="#94A3B8"/>
  <rect x="29" y="39" width="13" height="3" rx="1.5" fill="#1E3A8A"/>

  <!-- scanning beam -->
  <rect x="12" y="43" width="38" height="7" fill="url(#beam)"/>
  <rect x="11" y="46" width="40" height="1.6" rx="0.8" fill="#14B8A6"/>

  <!-- AI sparkle -->
  <path d="M50 4.5l1.9 5.1 5.1 1.9-5.1 1.9L50 18.5l-1.9-5.1-5.1-1.9 5.1-1.9z" fill="#FDE68A"/>
  <path d="M56.5 17l0.9 2.4 2.4 0.9-2.4 0.9-0.9 2.4-0.9-2.4-2.4-0.9 2.4-0.9z" fill="#FDE68A"/>
</svg>
